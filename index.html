<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Race-day cheer plan for the Indianapolis Monumental Marathon, Saturday, Nov 7, 2026.">
<title>Monumental Marathon · Cheer Plan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=20261106e">
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Monumental Marathon · Sat, Nov 7</p>
    <h1>Cheer Plan</h1>
  </div>
  <nav class="tabs wrap" aria-label="Sections">
    <a href="#plan" data-tab="plan">Plan</a>
    <a href="#map" data-tab="map">Map</a>
    <a href="#links" data-tab="links">Links</a>
  </nav>
</header>

<main class="wrap">
  <section id="view-plan" class="view">
    <div class="status" id="status"></div>

    <div class="predicted" id="predicted"></div>

    <p class="draft" id="draft" hidden></p>
    <ol class="timeline" id="timeline"></ol>
    <p class="rule" id="rule"></p>
  </section>

  <section id="view-map" class="view" hidden>
    <div id="course-map" class="course-map" role="region" aria-label="Interactive course map"></div>
    <p class="fallback" id="map-fallback" hidden>The map couldn't load. Try the <a href="#links">official maps</a>.</p>
    <div class="map-actions">
      <button type="button" class="btn ghost" id="fit-btn">Whole course</button>
      <button type="button" class="btn ghost" id="locate-btn">Where am I?</button>
    </div>
    <p class="fine">Tap a pin for estimated times. The route is traced by hand from the official map: close, not exact.</p>
  </section>

  <section id="view-links" class="view" hidden>
    <div id="links-list"></div>
    <h2>Official maps</h2>
    <div class="maps-grid" id="map-list"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js?v=20261106e"></script>
<script src="course.js?v=20261106e"></script>
<script src="app.js?v=20261106e"></script>
</body>
</html>
